[tool.poetry]
name = "datacontract-faker"
version = "0.1.0"
description = "Generate high-quality synthetic data from ODCS data contracts"
authors = ["MickaelBZH"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/MickaelBZH/data-contract-faker"
homepage = "https://github.com/MickaelBZH/data-contract-faker"
keywords = ["data-contract", "synthetic-data", "faker", "odcs", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "datacontract_faker", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
faker = "^24.0.0"
datacontract-cli = "^0.10.0"
typer = {extras = ["all"], version = "^0.12.0"}
click = ">=8.0.0,<8.2"
polars = {extras = ["pyarrow"], version = "^0.20.0"}
pyyaml = "^6.0"
rich = "^13.7.0"
rstr = "^3.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

[tool.poetry.scripts]
datacontract-faker = "datacontract_faker.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/datacontract_faker --cov-report=term-missing -q"
